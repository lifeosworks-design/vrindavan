{% extends "base.html" %}
{% block title %}Reset password — {{ S.store_name }}{% endblock %}
{% block content %}
<div class="container narrow">
  <h1>Reset your password</h1>
  {% if sent %}<div class="flash success">If that email has an account, a reset link has been prepared. Check your inbox.</div>
  {% else %}
  <form method="post" class="card-box"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username"></div>
    <button class="btn btn-block" type="submit">Send reset link</button>
  </form>{% endif %}
  <p class="center"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
</div>
{% endblock %}
